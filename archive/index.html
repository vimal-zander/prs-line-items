<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRS Line Items Archive</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, Helvetica, Arial, sans-serif;
    max-width: 640px;
    margin: 60px auto;
    padding: 0 20px;
    color: #1c1c1e;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  p.sub { color: #666; margin-top: 0; font-size: 14px; }
  input[type=search] {
    font-size: 15px; padding: 8px 10px; border: 1px solid #ccc;
    border-radius: 6px; width: 100%; box-sizing: border-box; margin: 16px 0;
  }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #e5e5e5; font-size: 14px; }
  th { color: #666; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; }
  tr:hover td { background: #f7f7f8; }
  a.dl { color: #007aff; text-decoration: none; font-weight: 600; }
  a.dl:hover { text-decoration: underline; }
  .size { color: #888; }
  #empty { display: none; color: #888; padding: 20px 0; text-align: center; }
</style>
</head>
<body>
  <h1>PRS Line Items Archive</h1>
  <p class="sub">Daily exports of the PRS line-item snapshot query. Click a date to download the .xlsx.</p>

  <input type="search" id="filter" placeholder="Filter by date (e.g. 2026-09)">

  <table>
    <thead>
      <tr><th>Date</th><th>File</th><th>Size</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="empty">No matching files.</div>

<script>
function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

let manifest = [];

async function load() {
  const res = await fetch('manifest.json', { cache: 'no-store' });
  manifest = await res.json();
  manifest.sort((a, b) => b.date.localeCompare(a.date));
  render(manifest);
}

function render(items) {
  const rows = document.getElementById('rows');
  const empty = document.getElementById('empty');
  rows.innerHTML = '';
  if (items.length === 0) {
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  for (const item of items) {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${item.date}</td>
      <td><a class="dl" href="${item.file}" download>${item.file.split('/').pop()}</a></td>
      <td class="size">${formatSize(item.size)}</td>
    `;
    rows.appendChild(tr);
  }
}

document.getElementById('filter').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  render(manifest.filter(item => item.date.toLowerCase().includes(q)));
});

load();
</script>
</body>
</html>
